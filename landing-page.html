<!DOCTYPE html>
<html lang="en" dir="ltr">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Prime Dental |Our Services</title>

        <!-- Bootstrap -->
        <link
            href="css/bootstrap.min.css"
            rel="stylesheet">

        <!-- Bootstrap Icons -->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
            rel="stylesheet">

        <!-- Custom CSS -->
        <link rel="stylesheet" href="css/style.css">
        <link rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" />

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"
            rel="stylesheet" />

        <link rel="shortcut icon" href="img/download (35).png"
            type="image/x-icon">

        <style>
            /* Opsional: Menghilangkan border bawaan modal agar benar-benar seamless */
            .modal-content {
                border: none;
                border-radius: 0;
            }
        </style>
    </head>

    <body>
        <div class="modal fade" id="welcomeModal" tabindex="-1" aria-labelledby="welcomeModalLabel" aria-hidden="true" data-bs-backdrop="static" data-bs-keyboard="false">
            <div class="modal-dialog modal-fullscreen">
                <div class="modal-content d-flex flex-column justify-content-center align-items-center bg-dark text-white text-center p-4">
                    


                    <h1 class="hero-title" id="welcomeModalLabel">
                    Professional & Modern Dental Care
                </h1>

                <p class="hero-text">
                    We provide advanced and high-quality dental solutions
                    to keep your smile healthy and bright.
                </p>

                    <button type="button" class="btn btn-primary btn-lg px-5" data-bs-dismiss="modal">
                        Masuk ke Situs
                    </button>
                    
                </div>
            </div>
        </div>
        <!--hero section-->
        <section class="hero-section">

            <div class="container text-center">

                
            </div>

        </section>

        <!-- Bootstrap JS && custom js-->
        <script
            src="js/bootstrap.bundle.min.js"></script>
        <script src="js/main.js"></script>

        <script>
            document.addEventListener("DOMContentLoaded", function () {
                // Menginisialisasi modal Bootstrap
                var myModal = new bootstrap.Modal(document.getElementById('welcomeModal'));
                // Menampilkan modal secara otomatis saat halaman selesai dimuat
                myModal.show();
            });
        </script>
    </body>
</html>
